# LR 32x32 -> HR 125x125 zero-padded to 128x128 (power-of-two target for clean
# 2x upsampling stages). HR area-downsampled to 32x32 as the model input.
scale: 32
hr_size: 128
use_native_lr: false
gen_channels: 64
gen_blocks: 8
lambda_l1: 50.0
lambda_physics: 10.0
lr: 2.0e-4
d_lr_ratio: 0.5
n_critic: 1
real_label: 0.9
batch_size: 64
epochs: 50
val_ratio: 0.33
seed: 42
wandb_project: multiscale-sr
